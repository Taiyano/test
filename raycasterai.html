<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
<title>3D Raycasting Maze - Dual Joysticks</title>
<style>
  body, html {
    margin: 0; padding: 0; overflow: hidden; background: #111;
    touch-action: none;
    -webkit-tap-highlight-color: transparent;
  }
  canvas {
    display: block;
    margin: 0 auto;
    background: #222;
  }
</style>
</head>
<body>
<canvas id="game"></canvas>

<script>
(() => {
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');

  let width, height;
  function resize() {
    width = window.innerWidth;
    height = window.innerHeight;
    canvas.width = width;
    canvas.height = height;
  }
  window.addEventListener('resize', resize);
  resize();

  const tileSize = 64;
  const mapWidth = 15;
  const mapHeight = 15;

  let maze = [];
  let px, py;       // player position (pixels)
  let direction;    // player view direction (radians)
  let fov = Math.PI / 3;
  let exitX, exitY;

  function generateMaze(w, h) {
    const maze = [];
    for (let y=0; y<h; y++) {
      maze[y] = [];
      for(let x=0; x<w; x++) {
        maze[y][x] = 0;
      }
    }

    for(let x=0; x<w; x++) {
      maze[0][x] = 1;
      maze[h-1][x] = 1;
    }
    for(let y=0; y<h; y++) {
      maze[y][0] = 1;
      maze[y][w-1] = 1;
    }

    function carve(x,y){
      const directions = [[2,0],[-2,0],[0,2],[0,-2]];
      shuffle(directions);
      for(let [dx,dy] of directions) {
        let nx = x+dx;
        let ny = y+dy;
        if(nx > 0 && nx < w-1 && ny > 0 && ny < h-1 && maze[ny][nx] === 0) {
          maze[ny][nx] = 1;
          maze[y + dy/2][x + dx/2] = 1;
          carve(nx, ny);
        }
      }
    }

    maze[1][1] = 1;
    carve(1,1);

    return maze;
  }

  function shuffle(arr) {
    for(let i=arr.length-1; i>0; i--){
      const j = Math.floor(Math.random()*(i+1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
  }

  function isWallAt(px, py) {
    if(px < 0 || py < 0 || px >= mapWidth*tileSize || py >= mapHeight*tileSize) return true;
    let x = Math.floor(px / tileSize);
    let y = Math.floor(py / tileSize);
    return maze[y][x] === 0;
  }

  function generatePalette() {
    const baseHue = Math.floor(Math.random() * 360);
    return [
      `hsl(${baseHue}, 70%, 40%)`,
      `hsl(${(baseHue + 30) % 360}, 60%, 50%)`,
      `hsl(${(baseHue + 60) % 360}, 50%, 60%)`
    ];
  }

  let palette;

  function setupGame() {
    maze = generateMaze(mapWidth, mapHeight);
    palette = generatePalette();

    px = 1 * tileSize + tileSize/2;
    py = 1 * tileSize + tileSize/2;
    direction = 0;

    for(let y=mapHeight-2; y>0; y--) {
      for(let x=mapWidth-2; x>0; x--) {
        if(maze[y][x] === 1) {
          exitX = x;
          exitY = y;
          return;
        }
      }
    }
  }

  function castRay(angle) {
    const maxDist = 1000;
    const step = 2;
    let dist = 0;
    let hitX, hitY;

    while(dist < maxDist) {
      dist += step;
      const rx = px + dist * Math.cos(angle);
      const ry = py + dist * Math.sin(angle);
      if(isWallAt(rx, ry)) {
        hitX = rx;
        hitY = ry;
        break;
      }
    }
    if(!hitX) return {dist: maxDist, color: 'black'};

    const cellX = Math.floor(hitX / tileSize);
    const cellY = Math.floor(hitY / tileSize);

    const offsetX = hitX - cellX * tileSize;
    const offsetY = hitY - cellY * tileSize;

    let color;
    if(offsetX < 2) color = palette[0];          // left wall
    else if(offsetX > tileSize - 2) color = palette[1];  // right wall
    else if(offsetY < 2) color = palette[2];    // top wall
    else if(offsetY > tileSize - 2) color = palette[1];  // bottom wall
    else color = palette[0];

    return {dist, color};
  }

  function movePlayer(dx, dy) {
    const radius = 10;

    let newX = px + dx;
    let newY = py + dy;

    if(!isWallAt(newX + radius, newY + radius) &&
       !isWallAt(newX - radius, newY + radius) &&
       !isWallAt(newX + radius, newY - radius) &&
       !isWallAt(newX - radius, newY - radius)) {
      px = newX;
      py = newY;
      return;
    }

    newX = px + dx;
    newY = py;
    if(!isWallAt(newX + radius, newY + radius) &&
       !isWallAt(newX - radius, newY + radius) &&
       !isWallAt(newX + radius, newY - radius) &&
       !isWallAt(newX - radius, newY - radius)) {
      px = newX;
      return;
    }

    newX = px;
    newY = py + dy;
    if(!isWallAt(newX + radius, newY + radius) &&
       !isWallAt(newX - radius, newY + radius) &&
       !isWallAt(newX + radius, newY - radius) &&
       !isWallAt(newX - radius, newY - radius)) {
      py = newY;
      return;
    }
  }

  // Keyboard input
  let keys = {};
  window.addEventListener('keydown', e => {
    keys[e.key.toLowerCase()] = true;
    if(['arrowup','arrowdown','arrowleft','arrowright'].includes(e.key.toLowerCase())) {
      e.preventDefault();
    }
  });
  window.addEventListener('keyup', e => {
    keys[e.key.toLowerCase()] = false;
  });

  // Dual joystick support
  let leftJoystick = {
    active: false,
    startX: 0,
    startY: 0,
    x: 0,
    y: 0
  };
  let rightJoystick = {
    active: false,
    startX: 0,
    startY: 0,
    x: 0,
    y: 0
  };

  canvas.addEventListener('touchstart', e => {
    for(let touch of e.changedTouches) {
      if(touch.clientX < width/2 && touch.clientY > height/2 && !leftJoystick.active) {
        leftJoystick.active = true;
        leftJoystick.startX = touch.clientX;
        leftJoystick.startY = touch.clientY;
        leftJoystick.x = touch.clientX;
        leftJoystick.y = touch.clientY;
      } else if(touch.clientX >= width/2 && touch.clientY > height/2 && !rightJoystick.active) {
        rightJoystick.active = true;
        rightJoystick.startX = touch.clientX;
        rightJoystick.startY = touch.clientY;
        rightJoystick.x = touch.clientX;
        rightJoystick.y = touch.clientY;
      }
    }
  }, {passive:false});

  canvas.addEventListener('touchmove', e => {
    for(let touch of e.changedTouches) {
      if(leftJoystick.active && Math.abs(touch.clientX - leftJoystick.startX) < 1000 &&
         Math.abs(touch.clientY - leftJoystick.startY) < 1000 &&
         touch.identifier === e.touches[0].identifier) {
        leftJoystick.x = touch.clientX;
        leftJoystick.y = touch.clientY;
        e.preventDefault();
      } else if(rightJoystick.active && Math.abs(touch.clientX - rightJoystick.startX) < 1000 &&
                Math.abs(touch.clientY - rightJoystick.startY) < 1000 &&
                touch.identifier === e.touches[0].identifier) {
        rightJoystick.x = touch.clientX;
        rightJoystick.y = touch.clientY;
        e.preventDefault();
      }
    }
  }, {passive:false});

  canvas.addEventListener('touchend', e => {
    for(let touch of e.changedTouches) {
      if(leftJoystick.active && touch.clientX === leftJoystick.x && touch.clientY === leftJoystick.y) {
        leftJoystick.active = false;
      }
      if(rightJoystick.active && touch.clientX === rightJoystick.x && touch.clientY === rightJoystick.y) {
        rightJoystick.active = false;
      }
    }
  });

  function update(dt) {
    const speed = 120 * dt;
    const rotationSpeed = 1.2 * dt; // default keyboard rotation speed

    // Keyboard rotation
    if(keys['a'] || keys['arrowleft']) {
      direction -= rotationSpeed;
    }
    if(keys['d'] || keys['arrowright']) {
      direction += rotationSpeed;
    }

    // Keyboard movement forward/back + strafe left/right
    let moveX = 0;
    let moveY = 0;
    if(keys['w'] || keys['arrowup']) {
      moveX += Math.cos(direction) * speed;
      moveY += Math.sin(direction) * speed;
    }
    if(keys['s'] || keys['arrowdown']) {
      moveX -= Math.cos(direction) * speed;
      moveY -= Math.sin(direction) * speed;
    }
    if(keys['q']) { // strafe left
      moveX += Math.cos(direction - Math.PI/2) * speed;
      moveY += Math.sin(direction - Math.PI/2) * speed;
    }
    if(keys['e']) { // strafe right
      moveX += Math.cos(direction + Math.PI/2) * speed;
      moveY += Math.sin(direction + Math.PI/2) * speed;
    }
    movePlayer(moveX, moveY);

    // Left joystick movement (strafe + forward/back)
    if(leftJoystick.active) {
      const dx = (leftJoystick.x - leftJoystick.startX) / 50;
      const dy = (leftJoystick.y - leftJoystick.startY) / 50;

      // y-axis inverted: pushing up (y < 0) means forward
      const forward = -dy * speed;
      const strafe = dx * speed;

      movePlayer(
        Math.cos(direction) * forward + Math.cos(direction + Math.PI/2) * strafe,
        Math.sin(direction) * forward + Math.sin(direction + Math.PI/2) * strafe
      );
    }

    // Right joystick controls rotation - SENSITIVITY LOWERED A LOT
    if(rightJoystick.active) {
      const dx = (rightJoystick.x - rightJoystick.startX) / 300; // sensitivity lower
      direction += dx;
    }
  }

  function render() {
    ctx.clearRect(0, 0, width, height);

    const numRays = width;
    const angleStep = fov / numRays;

    for(let i=0; i<numRays; i++) {
      const rayAngle = direction - fov/2 + angleStep * i;
      const ray = castRay(rayAngle);

      // fix fish-eye
      const fixDist = ray.dist * Math.cos(rayAngle - direction);

      let wallHeight = (tileSize * 6 * height) / fixDist;
      if(wallHeight > height) wallHeight = height;

      ctx.fillStyle = ray.color;
      ctx.fillRect(i, (height - wallHeight) / 2, 1, wallHeight);
    }

    // Draw exit square at the bottom left
    ctx.fillStyle = 'lime';
    ctx.fillRect(exitX * tileSize, exitY * tileSize, tileSize, tileSize);

    // Draw left joystick
    if(leftJoystick.active) {
      ctx.strokeStyle = 'rgba(0,255,0,0.7)';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.arc(leftJoystick.startX, leftJoystick.startY, 40, 0, Math.PI*2);
      ctx.stroke();

      ctx.beginPath();
      ctx.arc(leftJoystick.x, leftJoystick.y, 30, 0, Math.PI*2);
      ctx.stroke();
    }

    // Draw right joystick
    if(rightJoystick.active) {
      ctx.strokeStyle = 'rgba(0,0,255,0.7)';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.arc(rightJoystick.startX, rightJoystick.startY, 40, 0, Math.PI*2);
      ctx.stroke();

      ctx.beginPath();
      ctx.arc(rightJoystick.x, rightJoystick.y, 30, 0, Math.PI*2);
      ctx.stroke();
    }
  }

  let lastTime = 0;
  function loop(time = 0) {
    const dt = (time - lastTime) / 1000;
    lastTime = time;

    update(dt);
    render();
    requestAnimationFrame(loop);
  }

  setupGame();
  loop();

})();
</script>
</body>
</html>
