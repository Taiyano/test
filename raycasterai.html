<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
<title>3D Raycasting Maze - Mobile Friendly</title>
<style>
  body, html {
    margin: 0; padding: 0; overflow: hidden; background: #111;
    touch-action: none;
    -webkit-tap-highlight-color: transparent;
  }
  canvas {
    display: block;
    margin: 0 auto;
    background: #222;
  }
</style>
</head>
<body>
<canvas id="game"></canvas>

<script>
(() => {
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');

  let width, height;
  function resize() {
    width = window.innerWidth;
    height = window.innerHeight;
    canvas.width = width;
    canvas.height = height;
  }
  window.addEventListener('resize', resize);
  resize();

  const tileSize = 64;
  const mapWidth = 15;
  const mapHeight = 15;

  let maze = [];
  let px, py;       // player position (pixels)
  let direction;    // player view direction (radians)
  let fov = Math.PI / 3;
  let exitX, exitY;

  // Generate maze with recursive backtracking
  function generateMaze(w, h) {
    const maze = [];
    for (let y=0; y<h; y++) {
      maze[y] = [];
      for(let x=0; x<w; x++) {
        maze[y][x] = 0;
      }
    }

    // Fill borders with walls
    for(let x=0; x<w; x++) {
      maze[0][x] = 1;
      maze[h-1][x] = 1;
    }
    for(let y=0; y<h; y++) {
      maze[y][0] = 1;
      maze[y][w-1] = 1;
    }

    // Recursive backtracking carve paths
    function carve(x,y){
      const directions = [[2,0],[-2,0],[0,2],[0,-2]];
      shuffle(directions);
      for(let [dx,dy] of directions) {
        let nx = x+dx;
        let ny = y+dy;
        if(nx > 0 && nx < w-1 && ny > 0 && ny < h-1 && maze[ny][nx] === 0) {
          maze[ny][nx] = 1;
          maze[y + dy/2][x + dx/2] = 1;
          carve(nx, ny);
        }
      }
    }

    // Start carving from (1,1)
    maze[1][1] = 1;
    carve(1,1);

    return maze;
  }

  function shuffle(arr) {
    for(let i=arr.length-1; i>0; i--){
      const j = Math.floor(Math.random()*(i+1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
  }

  // Check if pixel position is inside a wall
  function isWallAt(px, py) {
    if(px < 0 || py < 0 || px >= mapWidth*tileSize || py >= mapHeight*tileSize) return true;
    let x = Math.floor(px / tileSize);
    let y = Math.floor(py / tileSize);
    return maze[y][x] === 0;
  }

  // Generate palette of 3 colors for walls
  function generatePalette() {
    const baseHue = Math.floor(Math.random() * 360);
    return [
      `hsl(${baseHue}, 70%, 40%)`,
      `hsl(${(baseHue + 30) % 360}, 60%, 50%)`,
      `hsl(${(baseHue + 60) % 360}, 50%, 60%)`
    ];
  }

  let palette;

  function setupGame() {
    maze = generateMaze(mapWidth, mapHeight);
    palette = generatePalette();

    px = 1 * tileSize + tileSize/2;
    py = 1 * tileSize + tileSize/2;
    direction = 0;

    // Find exit: bottom-right open cell
    for(let y=mapHeight-2; y>0; y--) {
      for(let x=mapWidth-2; x>0; x--) {
        if(maze[y][x] === 1) {
          exitX = x;
          exitY = y;
          return;
        }
      }
    }
  }

  // Raycasting to find wall distance and color
  function castRay(angle) {
    const maxDist = 1000;
    const step = 2;
    let dist = 0;
    let hitX, hitY;

    while(dist < maxDist) {
      dist += step;
      const rx = px + dist * Math.cos(angle);
      const ry = py + dist * Math.sin(angle);
      if(isWallAt(rx, ry)) {
        hitX = rx;
        hitY = ry;
        break;
      }
    }
    if(!hitX) return {dist: maxDist, color: 'black'};

    const cellX = Math.floor(hitX / tileSize);
    const cellY = Math.floor(hitY / tileSize);

    const offsetX = hitX - cellX * tileSize;
    const offsetY = hitY - cellY * tileSize;

    let color;
    if(offsetX < 2) color = palette[0];          // left wall
    else if(offsetX > tileSize - 2) color = palette[1];  // right wall
    else if(offsetY < 2) color = palette[2];    // top wall
    else if(offsetY > tileSize - 2) color = palette[1];  // bottom wall
    else color = palette[0];

    return {dist, color};
  }

  // Smooth gliding collision movement
  function movePlayer(dx, dy) {
    const radius = 10;

    let newX = px + dx;
    let newY = py + dy;

    if(!isWallAt(newX + radius, newY + radius) &&
       !isWallAt(newX - radius, newY + radius) &&
       !isWallAt(newX + radius, newY - radius) &&
       !isWallAt(newX - radius, newY - radius)) {
      px = newX;
      py = newY;
      return;
    }

    // Try only X movement
    newX = px + dx;
    newY = py;
    if(!isWallAt(newX + radius, newY + radius) &&
       !isWallAt(newX - radius, newY + radius) &&
       !isWallAt(newX + radius, newY - radius) &&
       !isWallAt(newX - radius, newY - radius)) {
      px = newX;
      return;
    }

    // Try only Y movement
    newX = px;
    newY = py + dy;
    if(!isWallAt(newX + radius, newY + radius) &&
       !isWallAt(newX - radius, newY + radius) &&
       !isWallAt(newX + radius, newY - radius) &&
       !isWallAt(newX - radius, newY - radius)) {
      py = newY;
      return;
    }

    // Blocked, no movement
  }

  // Handle input
  let keys = {};
  window.addEventListener('keydown', e => {
    keys[e.key.toLowerCase()] = true;
    if(['arrowup','arrowdown','arrowleft','arrowright'].includes(e.key.toLowerCase())) {
      e.preventDefault();
    }
  });
  window.addEventListener('keyup', e => {
    keys[e.key.toLowerCase()] = false;
  });

  // For mobile: simple touch joystick in bottom-left
  let touchX = null;
  let touchY = null;
  let joystickActive = false;

  canvas.addEventListener('touchstart', e => {
    const t = e.touches[0];
    if(t.clientX < width/2 && t.clientY > height/2) {
      joystickActive = true;
      touchX = t.clientX;
      touchY = t.clientY;
    }
  }, {passive:false});

  canvas.addEventListener('touchmove', e => {
    if(joystickActive) {
      const t = e.touches[0];
      touchX = t.clientX;
      touchY = t.clientY;
      e.preventDefault();
    }
  }, {passive:false});

  canvas.addEventListener('touchend', e => {
    joystickActive = false;
    touchX = null;
    touchY = null;
  });

  // Game loop
  function update(dt) {
    const speed = 120 * dt;

    // WASD or arrow keys control forward/back and turn left/right
    if(keys['a'] || keys['arrowleft']) {
      direction -= 2 * dt;
    }
    if(keys['d'] || keys['arrowright']) {
      direction += 2 * dt;
    }

    let moveForward = 0;
    if(keys['w'] || keys['arrowup']) moveForward = 1;
    else if(keys['s'] || keys['arrowdown']) moveForward = -1;

    if(moveForward !== 0) {
      const dx = Math.cos(direction) * speed * moveForward;
      const dy = Math.sin(direction) * speed * moveForward;
      movePlayer(dx, dy);
    }

    // Mobile joystick overrides movement/rotation
    if(joystickActive && touchX !== null && touchY !== null) {
      const centerX = width/4;
      const centerY = height*0.75;
      const dx = touchX - centerX;
      const dy = touchY - centerY;

      // Angle of joystick from center
      const angle = Math.atan2(dy, dx);
      const dist = Math.min(Math.sqrt(dx*dx + dy*dy), 50);

      // Rotate player based on horizontal joystick motion
      direction += dx * 0.002;

      // Move player forward/back based on vertical joystick motion
      const moveSpeed = ( -dy / 50 ) * speed;
      const mvx = Math.cos(direction) * moveSpeed;
      const mvy = Math.sin(direction) * moveSpeed;
      movePlayer(mvx, mvy);
    }
  }

  function draw() {
    ctx.clearRect(0, 0, width, height);

    // Draw sky and floor
    const horizon = height/2;
    const skyGradient = ctx.createLinearGradient(0, 0, 0, horizon);
    skyGradient.addColorStop(0, '#87CEEB');
    skyGradient.addColorStop(1, '#555');
    ctx.fillStyle = skyGradient;
    ctx.fillRect(0, 0, width, horizon);

    ctx.fillStyle = '#444';
    ctx.fillRect(0, horizon, width, height - horizon);

    // Raycasting
    const numRays = width;
    const rayStep = fov / numRays;

    for(let i=0; i<numRays; i++) {
      const rayAngle = direction - fov/2 + i * rayStep;
      const ray = castRay(rayAngle);

      // Fix fish-eye by cosine correction
      const correctedDist = ray.dist * Math.cos(rayAngle - direction);

      // Calculate wall height (distance projection)
      const wallHeight = (tileSize * height) / correctedDist;

      ctx.fillStyle = ray.color;
      ctx.fillRect(i, horizon - wallHeight/2, 1, wallHeight);
    }

    // Draw simple HUD: player direction
    ctx.fillStyle = 'white';
    ctx.font = '14px monospace';
    ctx.fillText(`Use WASD/Arrows or joystick (bottom-left)`, 10, 20);

    // Draw joystick circle for mobile
    if(joystickActive) {
      const centerX = width/4;
      const centerY = height*0.75;

      ctx.strokeStyle = '#aaa';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.arc(centerX, centerY, 50, 0, Math.PI*2);
      ctx.stroke();

      ctx.fillStyle = '#888';
      ctx.beginPath();
      ctx.arc(touchX, touchY, 30, 0, Math.PI*2);
      ctx.fill();
    }
  }

  let last = 0;
  function loop(timestamp=0) {
    const dt = (timestamp - last)/1000;
    last = timestamp;
    update(dt);
    draw();
    requestAnimationFrame(loop);
  }

  setupGame();
  loop();
})();
</script>
</body>
</html>
