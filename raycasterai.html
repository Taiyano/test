<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
<title>3D Raycasting Maze - One Joystick & Minimap</title>
<style>
  body, html {
    margin: 0; padding: 0; overflow: hidden; background: #111;
    touch-action: none;
    -webkit-tap-highlight-color: transparent;
  }
  canvas {
    display: block;
    margin: 0 auto;
    background: #222;
  }
</style>
</head>
<body>
<canvas id="game"></canvas>

<script>
(() => {
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');

  let width, height;
  function resize() {
    width = window.innerWidth;
    height = window.innerHeight;
    canvas.width = width;
    canvas.height = height;
  }
  window.addEventListener('resize', resize);
  resize();

  const tileSize = 64;
  const mapWidth = 15;
  const mapHeight = 15;

  let maze = [];
  let px, py;       // player position (pixels)
  let direction;    // player view direction (radians)
  let fov = Math.PI / 3;
  let exitX, exitY;

  // Maze generation (recursive backtracking)
  function generateMaze(w, h) {
    const maze = [];
    for (let y=0; y<h; y++) {
      maze[y] = [];
      for(let x=0; x<w; x++) {
        maze[y][x] = 0;
      }
    }

    for(let x=0; x<w; x++) {
      maze[0][x] = 1;
      maze[h-1][x] = 1;
    }
    for(let y=0; y<h; y++) {
      maze[y][0] = 1;
      maze[y][w-1] = 1;
    }

    function carve(x,y){
      const directions = [[2,0],[-2,0],[0,2],[0,-2]];
      shuffle(directions);
      for(let [dx,dy] of directions) {
        let nx = x+dx;
        let ny = y+dy;
        if(nx > 0 && nx < w-1 && ny > 0 && ny < h-1 && maze[ny][nx] === 0) {
          maze[ny][nx] = 1;
          maze[y + dy/2][x + dx/2] = 1;
          carve(nx, ny);
        }
      }
    }

    maze[1][1] = 1;
    carve(1,1);

    return maze;
  }

  function shuffle(arr) {
    for(let i=arr.length-1; i>0; i--){
      const j = Math.floor(Math.random()*(i+1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
  }

  function isWallAt(px, py) {
    if(px < 0 || py < 0 || px >= mapWidth*tileSize || py >= mapHeight*tileSize) return true;
    let x = Math.floor(px / tileSize);
    let y = Math.floor(py / tileSize);
    return maze[y][x] === 0;
  }

  function generatePalette() {
    const baseHue = Math.floor(Math.random() * 360);
    return [
      `hsl(${baseHue}, 70%, 40%)`,
      `hsl(${(baseHue + 30) % 360}, 60%, 50%)`,
      `hsl(${(baseHue + 60) % 360}, 50%, 60%)`
    ];
  }

  let palette;

  function setupGame() {
    maze = generateMaze(mapWidth, mapHeight);
    palette = generatePalette();

    px = 1 * tileSize + tileSize/2;
    py = 1 * tileSize + tileSize/2;
    direction = 0;

    // Find exit position (last reachable cell)
    outer: for(let y=mapHeight-2; y>0; y--) {
      for(let x=mapWidth-2; x>0; x--) {
        if(maze[y][x] === 1) {
          exitX = x;
          exitY = y;
          break outer;
        }
      }
    }
  }

  function castRay(angle) {
    const maxDist = 1000;
    const step = 2;
    let dist = 0;
    let hitX, hitY;

    while(dist < maxDist) {
      dist += step;
      const rx = px + dist * Math.cos(angle);
      const ry = py + dist * Math.sin(angle);
      if(isWallAt(rx, ry)) {
        hitX = rx;
        hitY = ry;
        break;
      }
    }
    if(!hitX) return {dist: maxDist, color: 'black'};

    const cellX = Math.floor(hitX / tileSize);
    const cellY = Math.floor(hitY / tileSize);

    const offsetX = hitX - cellX * tileSize;
    const offsetY = hitY - cellY * tileSize;

    let color;
    if(offsetX < 2) color = palette[0];
    else if(offsetX > tileSize - 2) color = palette[1];
    else if(offsetY < 2) color = palette[2];
    else if(offsetY > tileSize - 2) color = palette[1];
    else color = palette[0];

    return {dist, color};
  }

  function movePlayer(dx, dy) {
    const radius = 10;

    let newX = px + dx;
    let newY = py + dy;

    // Check 4 corners for collision
    if(!isWallAt(newX + radius, newY + radius) &&
       !isWallAt(newX - radius, newY + radius) &&
       !isWallAt(newX + radius, newY - radius) &&
       !isWallAt(newX - radius, newY - radius)) {
      px = newX;
      py = newY;
      return;
    }

    // Try horizontal only
    newX = px + dx;
    newY = py;
    if(!isWallAt(newX + radius, newY + radius) &&
       !isWallAt(newX - radius, newY + radius) &&
       !isWallAt(newX + radius, newY - radius) &&
       !isWallAt(newX - radius, newY - radius)) {
      px = newX;
      return;
    }

    // Try vertical only
    newX = px;
    newY = py + dy;
    if(!isWallAt(newX + radius, newY + radius) &&
       !isWallAt(newX - radius, newY + radius) &&
       !isWallAt(newX + radius, newY - radius) &&
       !isWallAt(newX - radius, newY - radius)) {
      py = newY;
      return;
    }
  }

  // Keyboard input
  let keys = {};
  window.addEventListener('keydown', e => {
    keys[e.key.toLowerCase()] = true;
    if(['arrowup','arrowdown','arrowleft','arrowright'].includes(e.key.toLowerCase())) {
      e.preventDefault();
    }
  });
  window.addEventListener('keyup', e => {
    keys[e.key.toLowerCase()] = false;
  });

  // One joystick on bottom left (movement)
  let joystick = {
    active: false,
    id: null,
    startX: 0,
    startY: 0,
    x: 0,
    y: 0
  };

  // Track right half dragging for camera rotation
  let cameraDrag = {
    active: false,
    id: null,
    lastX: 0
  };

  canvas.addEventListener('touchstart', e => {
    for(let touch of e.changedTouches) {
      if(touch.clientX < width/2 && touch.clientY > height/2 && !joystick.active) {
        joystick.active = true;
        joystick.id = touch.identifier;
        joystick.startX = touch.clientX;
        joystick.startY = touch.clientY;
        joystick.x = touch.clientX;
        joystick.y = touch.clientY;
      } else if(touch.clientX >= width/2 && !cameraDrag.active) {
        cameraDrag.active = true;
        cameraDrag.id = touch.identifier;
        cameraDrag.lastX = touch.clientX;
      }
    }
  }, {passive:false});

  canvas.addEventListener('touchmove', e => {
    for(let touch of e.changedTouches) {
      if(joystick.active && touch.identifier === joystick.id) {
        joystick.x = touch.clientX;
        joystick.y = touch.clientY;
        e.preventDefault();
      } else if(cameraDrag.active && touch.identifier === cameraDrag.id) {
        let dx = touch.clientX - cameraDrag.lastX;
        direction += dx * 0.02; // VERY LOW sensitivity
        cameraDrag.lastX = touch.clientX;
        e.preventDefault();
      }
    }
  }, {passive:false});

  canvas.addEventListener('touchend', e => {
    for(let touch of e.changedTouches) {
      if(joystick.active && touch.identifier === joystick.id) {
        joystick.active = false;
        joystick.id = null;
      }
      if(cameraDrag.active && touch.identifier === cameraDrag.id) {
        cameraDrag.active = false;
        cameraDrag.id = null;
      }
    }
  }, {passive:false});

  function update() {
    // Movement from joystick
    if(joystick.active) {
      let dx = joystick.x - joystick.startX;
      let dy = joystick.y - joystick.startY;
      const maxDist = 60;
      if(dx*dx + dy*dy > maxDist*maxDist) {
        let angle = Math.atan2(dy, dx);
        dx = Math.cos(angle)*maxDist;
        dy = Math.sin(angle)*maxDist;
      }
      // Normalize and apply small speed
      const speed = 2.5;
      const len = Math.sqrt(dx*dx + dy*dy);
      if(len > 10) {
        let moveX = (dx / maxDist) * speed;
        let moveY = (dy / maxDist) * speed;

        // Convert joystick direction relative to player view direction
        // Y-axis on screen is down, invert dy for forward/back
        let forward = -(moveY);
        let strafe = moveX;

        let movex = Math.cos(direction)*forward + Math.sin(direction)*strafe;
        let movey = Math.sin(direction)*forward - Math.cos(direction)*strafe;

        movePlayer(movex, movey);
      }
    }

    // Keyboard support (WASD or arrows)
    let forward = 0, strafe = 0;
    if(keys['w'] || keys['arrowup']) forward += 2.5;
    if(keys['s'] || keys['arrowdown']) forward -= 2.5;
    if(keys['a'] || keys['arrowleft']) strafe -= 2.5;
    if(keys['d'] || keys['arrowright']) strafe += 2.5;

    if(forward !== 0 || strafe !== 0) {
      let movex = Math.cos(direction)*forward + Math.sin(direction)*strafe;
      let movey = Math.sin(direction)*forward - Math.cos(direction)*strafe;
      movePlayer(movex, movey);
    }
  }

  function drawJoystick() {
    if(!joystick.active) return;
    ctx.save();
    ctx.globalAlpha = 0.4;
    ctx.fillStyle = '#666';
    ctx.beginPath();
    ctx.arc(joystick.startX, joystick.startY, 40, 0, Math.PI*2);
    ctx.fill();
    ctx.globalAlpha = 0.7;
    ctx.beginPath();
    ctx.arc(joystick.x, joystick.y, 30, 0, Math.PI*2);
    ctx.fill();
    ctx.restore();
  }

  function drawMinimap() {
    const mapSize = 120;
    const cellSize = mapSize / mapWidth;
    const offsetX = width - mapSize - 10;
    const offsetY = 10;

    ctx.save();
    ctx.fillStyle = '#ccc';
    ctx.fillRect(offsetX, offsetY, mapSize, mapSize);

    // Draw maze cells
    for(let y=0; y<mapHeight; y++) {
      for(let x=0; x<mapWidth; x++) {
        if(maze[y][x] === 0) {
          ctx.fillStyle = '#222';
        } else {
          ctx.fillStyle = '#eee';
        }
        ctx.fillRect(offsetX + x*cellSize, offsetY + y*cellSize, cellSize, cellSize);
      }
    }

    // Draw exit
    ctx.fillStyle = 'green';
    ctx.fillRect(offsetX + exitX*cellSize, offsetY + exitY*cellSize, cellSize, cellSize);

    // Draw player
    ctx.fillStyle = 'blue';
    const pxOnMap = offsetX + (px / tileSize) * cellSize;
    const pyOnMap = offsetY + (py / tileSize) * cellSize;
    ctx.beginPath();
    ctx.arc(pxOnMap, pyOnMap, cellSize/4, 0, Math.PI*2);
    ctx.fill();

    // Draw direction line
    ctx.strokeStyle = 'blue';
    ctx.beginPath();
    ctx.moveTo(pxOnMap, pyOnMap);
    ctx.lineTo(pxOnMap + Math.cos(direction)*cellSize/2, pyOnMap + Math.sin(direction)*cellSize/2);
    ctx.stroke();

    ctx.restore();
  }

  function render3D() {
    ctx.clearRect(0, 0, width, height);
    const numRays = width;
    for(let i=0; i<numRays; i++) {
      let rayScreenPos = (i / numRays) - 0.5;
      let rayAngle = direction + rayScreenPos * fov;
      const ray = castRay(rayAngle);
      let correctedDist = ray.dist * Math.cos(rayAngle - direction); // fix fish-eye

      let wallHeight = (tileSize * height) / correctedDist;
      if(wallHeight > height) wallHeight = height;

      ctx.fillStyle = ray.color;
      ctx.fillRect(i, (height - wallHeight)/2, 1, wallHeight);

      // Floor & ceiling simple shading
      ctx.fillStyle = '#444';
      ctx.fillRect(i, (height + wallHeight)/2, 1, height);
      ctx.fillStyle = '#222';
      ctx.fillRect(i, 0, 1, (height - wallHeight)/2);
    }
  }

  function checkWin() {
    const cellX = Math.floor(px / tileSize);
    const cellY = Math.floor(py / tileSize);
    if(cellX === exitX && cellY === exitY) {
      alert("You escaped the maze! 🎉");
      setupGame();
    }
  }

  function loop() {
    update();
    render3D();
    drawJoystick();
    drawMinimap();
    checkWin();
    requestAnimationFrame(loop);
  }

  setupGame();
  loop();
})();
</script>
</body>
</html>
